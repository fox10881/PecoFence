[package]
name = "coredesk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CoreDesk: group your desktop icons into glass fences on Windows 11."
build = "build.rs"

[[bin]]
name = "coredesk"
path = "src/main.rs"

[dependencies]
windows-core = { workspace = true }
windows = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
coredesk-core = { path = "../core" }
coredesk-ipc = { path = "../ipc" }
coredesk-platform = { path = "../platform" }
coredesk-render = { path = "../render" }
windows-composition = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
