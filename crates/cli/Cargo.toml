[package]
name = "coredesk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CoreDesk command-line control for terminals and coding agents."
build = "build.rs"

[[bin]]
name = "coredesk-cli"
path = "src/main.rs"

[dependencies]
coredesk-core = { path = "../core" }
coredesk-ipc = { path = "../ipc", features = ["describe"] }
# The pipe name with the user's SID, computed as the app does (client.rs).
coredesk-platform = { path = "../platform" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
