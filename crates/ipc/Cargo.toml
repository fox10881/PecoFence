[package]
name = "coredesk-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire protocol shared by CoreDesk and coredesk-cli (named-pipe JSON requests)."

[dependencies]
coredesk-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
# JSON Schema export for `coredesk-cli describe`; the app never enables it.
describe = ["dep:schemars", "coredesk-core/schema"]

[lints]
workspace = true
